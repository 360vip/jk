name: TVBox Config Update

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests gitpython beautifulsoup4 html5lib chardet pycryptodome
        
    - name: 创建必要目录
      run: |
        mkdir -p data
        mkdir -p proxy
        mkdir -p tvbox/jar
        mkdir -p xl
        mkdir -p jiemi
        mkdir -p datamz
        mkdir -p myjk
        mkdir -p bbjk
        mkdir -p mybox
        echo "目录创建完成"
        
    - name: 从私有仓库克隆并复制文件
      run: |
        # 克隆私有仓库
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/360vip/my.git /tmp/private-repo
        
        # 复制 Python 脚本文件
        if [ -f "/tmp/private-repo/toolspy/tvbox_tools.py" ]; then
          cp /tmp/private-repo/toolspy/tvbox_tools.py .
          echo "tvbox_tools.py 已复制"
        else
          echo "警告: tvbox_tools.py 不存在"
        fi
        
        if [ -f "/tmp/private-repo/toolspy/mybox.py" ]; then
          cp /tmp/private-repo/toolspy/mybox.py .
          echo "mybox.py 已复制"
        else
          echo "警告: mybox.py 不存在"
        fi
        
        if [ -f "/tmp/private-repo/proxy/dl.py" ]; then
          cp /tmp/private-repo/proxy/dl.py .
          echo "dl.py 已复制"
        else
          echo "警告: dl.py 不存在"
        fi
        
        # 复制 jkmz.py 脚本
        if [ -f "/tmp/private-repo/toolspy/jkmz.py" ]; then
          cp /tmp/private-repo/toolspy/jkmz.py .
          echo "jkmz.py 已复制"
        else
          echo "警告: toolspy/jkmz.py 不存在"
        fi
        
        # 复制数据文件
        if [ -f "/tmp/private-repo/data/url.txt" ]; then
          cp /tmp/private-repo/data/url.txt ./data/
          echo "url.txt 已复制到 data 目录"
        else
          echo "警告: data/url.txt 不存在"
        fi
        
        if [ -f "/tmp/private-repo/proxy/url.txt" ]; then
          cp /tmp/private-repo/proxy/url.txt ./proxy/
          echo "url.txt 已复制到 proxy 目录"
        else
          echo "警告: proxy/url.txt 不存在"
        fi
        
        if [ -f "/tmp/private-repo/data/hmd.txt" ]; then
          cp /tmp/private-repo/data/hmd.txt ./data/
          echo "hmd.txt 已复制到 data 目录"
        else
          echo "警告: data/hmd.txt 不存在"
        fi

        # 复制 datamz 目录所有文件
        if [ -d "/tmp/private-repo/datamz" ]; then
          cp -r /tmp/private-repo/datamz/* ./datamz/ 2>/dev/null || echo "datamz 目录为空"
          echo "datamz 目录文件已复制"
        else
          echo "警告: datamz 目录不存在"
        fi

        # 复制 mybox 目录所有文件
        if [ -d "/tmp/private-repo/mybox" ]; then
          cp -r /tmp/private-repo/mybox/* ./mybox/ 2>/dev/null || echo "mybox 目录为空"
          echo "mybox 目录文件已复制"
        else
          echo "警告: mybox 目录不存在"
        fi

        # 复制 jiemi 目录所有文件到 mybox 目录
        if [ -d "/tmp/private-repo/jiemi" ]; then
          cp -r /tmp/private-repo/jiemi/* ./mybox/ 2>/dev/null || echo "jiemi 目录为空"
          echo "jiemi 目录文件已复制到 mybox 目录"
        else
          echo "警告: jiemi 目录不存在"
        fi

        # 清理临时目录
        rm -rf /tmp/private-repo
        echo "私有仓库文件复制完成"
        
    - name: 更新 tvbox 接口
      run: |
        python tvbox_tools.py
        
    - name: 代理检测速度
      run: |
        python dl.py
        
    - name: 运行 接口格式标准化转换
      run: |
        python mybox.py
        
    - name: 运行 接口名字修改
      run: |
        if [ -f "jkmz.py" ]; then
          python jkmz.py
          echo "接口名字修改 运行完成"
        else
          echo "警告: jkmz.py 不存在，跳过运行"
        fi
        
    - name: 推送 mybox 目录到私有仓库
      run: |
        if [ ! -d "mybox" ]; then
          echo "警告: mybox 目录不存在，跳过推送"
          exit 0
        fi
        
        echo "开始推送 mybox 目录到私有仓库..."
        
        # 克隆私有仓库
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/360vip/my.git /tmp/push-repo
        
        # 确保目标目录存在
        mkdir -p /tmp/push-repo/mybox
        
        # 复制 mybox 目录内容
        cp -r mybox/* /tmp/push-repo/mybox/ 2>/dev/null || echo "mybox 目录为空"
        
        cd /tmp/push-repo
        
        # 配置 git 用户信息
        git config user.name "github-actions"
        git config user.email "github-actions@users.noreply.github.com"
        
        # 添加文件
        git add mybox/
        
        # 检查变更并提交
        if git diff --cached --quiet; then
          echo "mybox 目录没有变更需要提交"
        else
          git commit -m "自动更新 mybox 目录 - $(date '+%Y-%m-%d %H:%M:%S')"
          git push origin main
          echo "mybox 目录已成功推送到私有仓库"
        fi
        
        cd /
        rm -rf /tmp/push-repo
        
    - name: 推送 xl 目录到私有仓库
      run: |
        if [ ! -d "xl" ]; then
          echo "警告: xl 目录不存在，跳过推送"
          exit 0
        fi
        
        echo "开始推送 xl 目录到私有仓库..."
        
        # 克隆私有仓库
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/360vip/my.git /tmp/push-repo-xl
        
        # 确保目标目录存在
        mkdir -p /tmp/push-repo-xl/xl
        
        # 复制 xl 目录内容
        cp -r xl/* /tmp/push-repo-xl/xl/ 2>/dev/null || echo "xl 目录为空"
        
        cd /tmp/push-repo-xl
        
        # 配置 git 用户信息
        git config user.name "github-actions"
        git config user.email "github-actions@users.noreply.github.com"
        
        # 添加文件
        git add xl/
        
        # 检查变更并提交
        if git diff --cached --quiet; then
          echo "xl 目录没有变更需要提交"
        else
          git commit -m "自动更新 xl 目录 - $(date '+%Y-%m-%d %H:%M:%S')"
          git push origin main
          echo "xl 目录已成功推送到私有仓库"
        fi
        
        cd /
        rm -rf /tmp/push-repo-xl

    - name: 推送 jiemi 目录到私有仓库
      run: |
        if [ ! -d "jiemi" ]; then
          echo "警告: jiemi 目录不存在，跳过推送"
          exit 0
        fi
        
        echo "开始推送 jiemi 目录到私有仓库..."
        
        # 克隆私有仓库
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/360vip/my.git /tmp/push-repo-jiemi
        
        # 确保目标目录存在
        mkdir -p /tmp/push-repo-jiemi/jiemi
        
        # 复制 jiemi 目录内容
        cp -r jiemi/* /tmp/push-repo-jiemi/jiemi/ 2>/dev/null || echo "jiemi 目录为空"
        
        cd /tmp/push-repo-jiemi
        
        # 配置 git 用户信息
        git config user.name "github-actions"
        git config user.email "github-actions@users.noreply.github.com"
        
        # 添加文件
        git add jiemi/
        
        # 检查变更并提交
        if git diff --cached --quiet; then
          echo "jiemi 目录没有变更需要提交"
        else
          git commit -m "自动更新 jiemi 目录 - $(date '+%Y-%m-%d %H:%M:%S')"
          git push origin main
          echo "jiemi 目录已成功推送到私有仓库"
        fi
        
        cd /
        rm -rf /tmp/push-repo-jiemi

    - name: 推送 myjk 目录到私有仓库
      run: |
        if [ ! -d "myjk" ]; then
          echo "警告: myjk 目录不存在，跳过推送"
          exit 0
        fi
        
        echo "开始推送 myjk 目录到私有仓库..."
        
        # 克隆私有仓库
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/360vip/my.git /tmp/push-repo-myjk
        
        # 确保目标目录存在
        mkdir -p /tmp/push-repo-myjk/myjk
        
        # 复制 myjk 目录内容
        cp -r myjk/* /tmp/push-repo-myjk/myjk/ 2>/dev/null || echo "myjk 目录为空"
        
        cd /tmp/push-repo-myjk
        
        # 配置 git 用户信息
        git config user.name "github-actions"
        git config user.email "github-actions@users.noreply.github.com"
        
        # 添加文件
        git add myjk/
        
        # 检查变更并提交
        if git diff --cached --quiet; then
          echo "myjk 目录没有变更需要提交"
        else
          git commit -m "自动更新 myjk 目录 - $(date '+%Y-%m-%d %H:%M:%S')"
          git push origin main
          echo "myjk 目录已成功推送到私有仓库"
        fi
        
        cd /
        rm -rf /tmp/push-repo-myjk

    - name: 推送 bbjk 目录到私有仓库
      run: |
        if [ ! -d "bbjk" ]; then
          echo "警告: bbjk 目录不存在，跳过推送"
          exit 0
        fi
        
        echo "开始推送 bbjk 目录到私有仓库..."
        
        # 克隆私有仓库
        git clone https://${{ secrets.PRIVATE_REPO_TOKEN }}@github.com/360vip/my.git /tmp/push-repo-bbjk
        
        # 确保目标目录存在
        mkdir -p /tmp/push-repo-bbjk/bbjk
        
        # 复制 bbjk 目录内容
        cp -r bbjk/* /tmp/push-repo-bbjk/bbjk/ 2>/dev/null || echo "bbjk 目录为空"
        
        cd /tmp/push-repo-bbjk
        
        # 配置 git 用户信息
        git config user.name "github-actions"
