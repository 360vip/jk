          git push origin main
          echo "bbjk 目录已成功推送到私有仓库"
        fi
        
        cd /
        rm -rf /tmp/push-repo-bbjk
        
    - name: 本地推送 tvbox/jar 目录
      run: |
        if [ ! -d "tvbox/jar" ]; then
          echo "警告: tvbox/jar 目录不存在，跳过推送"
          exit 0
        fi
        
        # 配置 git
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # 只添加 tvbox/jar 目录
        git add tvbox/jar/
        
        # 检查是否有变更
        if git diff --cached --quiet; then
          echo "tvbox/jar 目录没有变更需要提交"
        else
          git commit -m "更新 tvbox/jar 目录 - $(date '+%Y-%m-%d %H:%M:%S')"
          git push origin main
          echo "tvbox/jar 目录已成功推送到本地仓库"
        fi